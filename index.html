let leafletMap;
let markersLayer;

function initMap() {
  // Set posisi dan zoom ke kawasan Kedah
  leafletMap = L.map('map').setView([6.1, 100.3], 8);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(leafletMap);

  markersLayer = L.layerGroup().addTo(leafletMap);

  // Muat fail KML (Sila pastikan fail bernama 'daerah-kedah.kml' berada di direktori yang sama)
  const kmlLayer = omnivore.kml('daerah-kedah.kml')
    .on('ready', function() {
      // Zoom secara automatik ke saiz peta KML daerah
      leafletMap.fitBounds(kmlLayer.getBounds());
      
      // Gayakan dan warnakan sempadan KML
      kmlLayer.eachLayer(function(layer) {
        layer.setStyle({
          color: '#0F6E56',
          weight: 1.5,
          fillColor: '#E1F5EE',
          fillOpacity: 0.3
        });
      });
    })
    .on('error', function() {
      console.warn("Fail 'daerah-kedah.kml' tidak ditemui. Peta stesen masih akan dipaparkan. Sila letak fail kml tersebut di folder yang sama.");
    })
    .addTo(leafletMap);
}
